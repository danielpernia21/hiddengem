name: travelbot

on:
  schedule:
    - cron: "55 18 * * 1,3,5"  # Mon/Wed/Fri 18:55 GMT/UTC
    - cron: "0 19 * * *"     # nightly feedback sweep
  workflow_dispatch:

permissions:
  contents: write

# Both crons land in the same minute after GitHub's delay; two jobs polling
# Telegram getUpdates at once trip a 409 Conflict.
concurrency:
  group: travelbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Suggestion
        if: github.event.schedule == '55 18 * * 1,3,5' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FARE_PROVIDER: ${{ vars.FARE_PROVIDER || 'ryanair' }}
          ORIGIN: ${{ vars.ORIGIN || 'BCN' }}
        run: python main.py

      - name: Collect feedback
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python feedback.py

      - name: Commit state
        run: |
          git config user.name  "travelbot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state.json offset.json feedback.jsonl geo_cache.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "state $(date -u +%F)"
          git push || true
